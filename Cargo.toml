[package]
name = "tuios-rs"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
description = "Rust rewrite of TUIOS (core multiplexer first)"

[dependencies]
crossterm = "0.29"
nix = { version = "0.28", default-features = false, features = ["process", "signal"] }
portable-pty = "0.9"
signal-hook = "0.3"
vt100 = "0.16"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
